name: "Feature request"
description: "Propose a new capability or improvement."
title: "[FEATURE] <concise summary>"
labels: ["enhancement"]
body:
  - type: input
    id: summary
    attributes:
      label: Summary
      description: What should be done?
      placeholder: Add CLI flag to export FBX nodes
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this important? Who benefits?
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Proposed solution
      description: Describe the idea, API shape, or UI flow. Include alternatives considered.
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Links, screenshots, or other notes.
